name: Build Brigade Zero APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify project
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib, string, zlib

          folder = pathlib.Path("build_payload")
          paths = sorted(folder.glob("part-*"))
          parts = [p.read_text().strip() for p in paths]
          joined = "".join(parts)

          def check(text):
              try:
                  raw = base64.b64decode(text, validate=True)
                  unpacked = gzip.decompress(raw)
                  if b"BlitzZeroAndroid/project.godot" not in unpacked:
                      return None
                  if b"BlitzZeroAndroid/export_presets.cfg" not in unpacked:
                      return None
                  return raw
              except Exception:
                  return None

          raw = check(joined)
          if raw is None:
              # The connector transfer dropped exactly one Base64 character.
              # Decode with a harmless final sextet, then find the compressed
              # byte at which gzip first becomes invalid. That localizes the
              # missing Base64 character to a tiny search window.
              padded = joined + "A"
              damaged = base64.b64decode(padded, validate=False)
              dec = zlib.decompressobj(31)
              fail_byte = None
              for i, b in enumerate(damaged):
                  try:
                      dec.decompress(bytes((b,)))
                  except zlib.error:
                      fail_byte = i
                      break
              if fail_byte is None:
                  fail_byte = len(damaged) // 2

              approx = max(0, min(len(joined), (fail_byte * 4) // 3))
              alphabet = string.ascii_uppercase + string.ascii_lowercase + string.digits + "+/"
              print(f"gzip corruption localised near compressed byte {fail_byte}, base64 char ~{approx}")

              fixed = None
              # Wide enough to account for Base64 quartet boundaries and zlib buffering.
              for radius in (24, 96, 384):
                  lo = max(0, approx - radius)
                  hi = min(len(joined), approx + radius + 1)
                  for pos in range(lo, hi):
                      left, right = joined[:pos], joined[pos:]
                      for ch in alphabet:
                          candidate = left + ch + right
                          candidate_raw = check(candidate)
                          if candidate_raw is not None:
                              fixed = (candidate_raw, pos, ch)
                              break
                      if fixed:
                          break
                  if fixed:
                      break

              if fixed is None:
                  raise SystemExit("Could not automatically repair Base64 payload")
              raw, pos, ch = fixed
              print(f"Recovered payload by inserting one Base64 character at position {pos}.")
          else:
              print("Payload already valid.")

          pathlib.Path("brigade.tar.gz").write_bytes(raw)
          print(f"Verified gzip payload: {len(raw)} bytes")
          PY
          tar -xzf brigade.tar.gz
          test -f BlitzZeroAndroid/project.godot
          test -f BlitzZeroAndroid/export_presets.cfg

      - name: Generate original placeholder SFX
        shell: bash
        run: |
          python3 - <<'PY'
          import math, os, struct, wave
          out="BlitzZeroAndroid/assets/audio"
          os.makedirs(out, exist_ok=True)
          specs={
            "carbine.wav":(720,.09),"smg.wav":(900,.07),"pistol.wav":(620,.10),
            "shotgun.wav":(180,.16),"marksman.wav":(520,.13),"lmg.wav":(430,.10),
            "reload.wav":(250,.22),"ability.wav":(980,.20),"explosion.wav":(90,.28)
          }
          sr=22050
          for name,(freq,dur) in specs.items():
              n=int(sr*dur)
              with wave.open(os.path.join(out,name),"wb") as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
                  frames=[]
                  for i in range(n):
                      t=i/sr
                      env=max(0.0,1.0-i/n)
                      if name=="explosion.wav":
                          v=math.sin(2*math.pi*freq*t)*env + .35*math.sin(2*math.pi*43*t)*env
                      else:
                          v=math.sin(2*math.pi*freq*t)*env
                      frames.append(struct.pack("<h", int(max(-1,min(1,v*.38))*32767)))
                  w.writeframes(b"".join(frames))
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin
          GODOT_BIN="$(find godot-bin -maxdepth 1 -type f -name 'Godot*' | head -1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$PWD/$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install Godot Android export templates
        shell: bash
        run: |
          curl -L --fail --retry 3 -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          rm -rf template-unpack
          mkdir template-unpack
          unzip -q templates.tpz -d template-unpack
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a template-unpack/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Create debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Brigade Zero,C=PT" -keyalg RSA -keysize 2048 -validity 10000

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          "$GODOT_BIN" --headless --editor --path BlitzZeroAndroid --quit-after 2 || true

      - name: Validate project files
        shell: bash
        run: |
          python3 BlitzZeroAndroid/tools/validate_project.py

      - name: Export APK
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          mkdir -p BlitzZeroAndroid/build
          "$GODOT_BIN" --headless --path BlitzZeroAndroid --editor --quit-after 3
          "$GODOT_BIN" --headless --path BlitzZeroAndroid --export-debug Android build/BrigadeZero.apk
          test -s BlitzZeroAndroid/build/BrigadeZero.apk
          ls -lh BlitzZeroAndroid/build/BrigadeZero.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrigadeZero-Android-APK
          path: BlitzZeroAndroid/build/BrigadeZero.apk
          if-no-files-found: error
          retention-days: 14
