name: Build Brigade Zero APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: brigade-zero-android-build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify project
        shell: bash
        run: |
          cat fresh_payload/part-* | base64 -d > brigade.tar.gz
          echo "19be3b7b58eb7f36f400ed7e010384990f31cdb8dd7bf023b218d8ee9629f02b  brigade.tar.gz" | sha256sum -c -
          gzip -t brigade.tar.gz
          tar -xzf brigade.tar.gz
          test -f BlitzZeroAndroid/project.godot
          test -f BlitzZeroAndroid/export_presets.cfg
          echo "Verified Brigade Zero source payload."

      - name: Generate original placeholder SFX
        shell: bash
        run: |
          python3 - <<'PY'
          import math, os, struct, wave
          out="BlitzZeroAndroid/assets/audio"
          os.makedirs(out, exist_ok=True)
          specs={
            "carbine.wav":(720,.09),"smg.wav":(900,.07),"pistol.wav":(620,.10),
            "shotgun.wav":(180,.16),"marksman.wav":(520,.13),"lmg.wav":(430,.10),
            "reload.wav":(250,.22),"ability.wav":(980,.20),"explosion.wav":(90,.28)
          }
          sr=22050
          for name,(freq,dur) in specs.items():
              n=int(sr*dur)
              with wave.open(os.path.join(out,name),"wb") as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
                  frames=[]
                  for i in range(n):
                      t=i/sr
                      env=max(0.0,1.0-i/n)
                      if name=="explosion.wav":
                          v=math.sin(2*math.pi*freq*t)*env + .35*math.sin(2*math.pi*43*t)*env
                      else:
                          v=math.sin(2*math.pi*freq*t)*env
                      frames.append(struct.pack("<h", int(max(-1,min(1,v*.38))*32767)))
                  w.writeframes(b"".join(frames))
          PY

      - name: Apply Godot 4.7 Android compatibility fixes
        shell: bash
        run: |
          # Godot Object already defines get_class(), so use an unambiguous data accessor.
          sed -i 's/^func get_class(/func get_class_data(/' BlitzZeroAndroid/scripts/game_data.gd
          sed -i 's/GameData\.get_class(/GameData.get_class_data(/g' BlitzZeroAndroid/scripts/*.gd

          # Godot 4.7 cannot infer a concrete Vector3 from an untyped Array index.
          sed -i 's/var best := spawns\[0\]/var best: Vector3 = spawns[0]/' BlitzZeroAndroid/scripts/main.gd

          # Valid empty AudioBusLayout resource.
          cat > BlitzZeroAndroid/default_bus_layout.tres <<'EOF'
          [gd_resource type="AudioBusLayout" format=3]

          [resource]
          EOF

          # Android export requires ETC2/ASTC import support.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("BlitzZeroAndroid/project.godot")
          s = p.read_text()
          key = "textures/vram_compression/import_etc2_astc=true"
          if key not in s:
              anchor = 'renderer/rendering_method.mobile="gl_compatibility"\n'
              if anchor not in s:
                  raise SystemExit("Rendering anchor not found")
              s = s.replace(anchor, anchor + key + "\n", 1)
          p.write_text(s)
          PY

      - name: Upload reconstructed source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: BrigadeZero-Source-Debug
          path: BlitzZeroAndroid
          if-no-files-found: error
          retention-days: 3

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use runner Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          test -x /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --version

      - name: Install Android components
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.1"
          test -x /usr/local/lib/android/sdk/platform-tools/adb

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin
          GODOT_BIN="$(find godot-bin -maxdepth 1 -type f -name 'Godot*' | head -1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$PWD/$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install Godot Android export templates
        shell: bash
        run: |
          curl -L --fail --retry 3 -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          rm -rf template-unpack
          mkdir template-unpack
          unzip -q templates.tpz -d template-unpack
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a template-unpack/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Create debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Brigade Zero,C=PT" -keyalg RSA -keysize 2048 -validity 10000

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          "$GODOT_BIN" --headless --editor --path BlitzZeroAndroid --quit-after 2 || true

      - name: Validate project files
        shell: bash
        run: |
          python3 BlitzZeroAndroid/tools/validate_project.py

      - name: Runtime main-scene smoke test
        shell: bash
        run: |
          set +e
          "$GODOT_BIN" --headless --path BlitzZeroAndroid --quit-after 180 > runtime.log 2>&1
          STATUS=$?
          set -e
          cat runtime.log
          echo "Godot runtime exit status: $STATUS"
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Cannot get class|Failed to load script|Failed to instantiate" runtime.log; then
            echo "Runtime script failure detected."
            exit 1
          fi

      - name: Export APK
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          mkdir -p BlitzZeroAndroid/build
          "$GODOT_BIN" --headless --path BlitzZeroAndroid --editor --quit-after 3
          "$GODOT_BIN" --headless --path BlitzZeroAndroid --export-debug Android build/BrigadeZero.apk
          test -s BlitzZeroAndroid/build/BrigadeZero.apk
          ls -lh BlitzZeroAndroid/build/BrigadeZero.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrigadeZero-Android-APK
          path: BlitzZeroAndroid/build/BrigadeZero.apk
          if-no-files-found: error
          retention-days: 14
